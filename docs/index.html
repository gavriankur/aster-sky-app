<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,viewport-fit=cover">
  <meta name="theme-color" content="#07101f">
  <title>Aster — Explore the night sky</title>
  <meta name="description" content="A mobile-first interactive guide to stars, planets, and constellations.">
  <style>
    :root{color-scheme:dark;--ink:#eff7ff;--muted:#8ea4bd;--cyan:#9deaff}*{box-sizing:border-box}html,body{margin:0;min-height:100%;background:#030712}body{font-family:Arial,Helvetica,sans-serif;color:var(--ink);overflow:hidden}button,input{font:inherit}button{color:inherit}.app{position:relative;width:100%;min-height:100dvh;overflow:hidden;background:radial-gradient(circle at 68% 34%,#12243e 0,#07101f 29%,#030712 72%)}.app.night{filter:sepia(.55) saturate(1.6) hue-rotate(315deg)}.camera,canvas,.aurora,.sky{position:absolute;inset:0;width:100%;height:100%}.camera{display:none;object-fit:cover;background:#02050a}.app.ar .camera{display:block}.app.ar canvas{opacity:.28}.app.ar .aurora{background:linear-gradient(rgba(3,8,15,.18),rgba(3,8,15,.38))}.app.ar .horizon{opacity:0}.aurora{background:radial-gradient(ellipse at 65% 42%,rgba(75,146,180,.14),transparent 40%),radial-gradient(ellipse at 20% 73%,rgba(55,103,139,.13),transparent 36%);filter:blur(22px)}.sky{transition:transform .16s ease-out}.horizon{position:absolute;left:-15%;bottom:13%;width:130%;height:18%;border-radius:50% 50% 0 0;background:linear-gradient(180deg,rgba(6,14,24,.45),#02050a)}.line{position:absolute;height:1px;transform-origin:left;background:linear-gradient(90deg,transparent,rgba(163,209,234,.32),transparent)}.celestial{position:absolute;border:0;padding:14px;transform:translate(-50%,-50%);background:transparent}.orb{display:block;width:var(--size);height:var(--size);margin:auto;border-radius:50%;background:var(--color);box-shadow:0 0 9px var(--color),0 0 22px var(--color)}.celestial.active .orb{outline:1px solid rgba(190,238,255,.7);outline-offset:10px}.label{display:block;margin-top:8px;font-size:10px;letter-spacing:.08em;color:#fff;text-shadow:0 1px 4px #000}.topbar{position:absolute;inset:0 0 auto;display:flex;align-items:center;justify-content:space-between;padding:max(18px,env(safe-area-inset-top)) 20px 10px;z-index:4}.brand{display:flex;align-items:center;gap:9px;font-size:18px;font-weight:700;text-shadow:0 1px 8px #000}.brand-mark{display:grid;place-items:center;width:29px;height:29px;border-radius:10px;color:#07101a;background:var(--cyan)}.actions{display:flex;gap:8px}.round{width:42px;height:42px;border:1px solid rgba(170,210,234,.16);border-radius:50%;background:rgba(8,18,31,.68);font-size:21px}.compass{position:absolute;top:86px;left:50%;transform:translateX(-50%);display:flex;gap:12px;color:#bdd0e0;font-size:10px;letter-spacing:.15em;z-index:3;text-shadow:0 1px 5px #000}.compass strong{color:#fff}.ar-status{position:absolute;top:116px;left:50%;transform:translateX(-50%);display:none;align-items:center;gap:6px;padding:7px 10px;border-radius:18px;background:rgba(4,12,20,.62);font-size:10px;letter-spacing:.06em;z-index:4;white-space:nowrap}.app.ar .ar-status{display:flex}.status-dot{width:7px;height:7px;border-radius:50%;background:#77e8b3;box-shadow:0 0 10px #77e8b3}.crosshair{position:absolute;left:50%;top:45%;display:none;width:42px;height:42px;transform:translate(-50%,-50%);border:1px solid rgba(218,244,255,.5);border-radius:50%;z-index:3}.crosshair:before,.crosshair:after{content:"";position:absolute;background:rgba(218,244,255,.55)}.crosshair:before{left:50%;top:-8px;width:1px;height:56px}.crosshair:after{top:50%;left:-8px;width:56px;height:1px}.app.ar .crosshair{display:block}.card{position:absolute;left:16px;right:16px;bottom:calc(100px + env(safe-area-inset-bottom));display:grid;grid-template-columns:58px 1fr 42px;align-items:center;gap:14px;padding:13px;border:1px solid rgba(175,219,244,.13);border-radius:22px;background:linear-gradient(135deg,rgba(18,34,52,.9),rgba(8,17,29,.88));backdrop-filter:blur(24px);z-index:4}.art{display:grid;place-items:center;width:58px;height:58px;border-radius:17px;background:radial-gradient(circle,var(--color),transparent 68%)}.art span{width:31px;height:31px;border-radius:50%;background:radial-gradient(circle at 32% 28%,white,var(--color) 22%,#14202e 72%);box-shadow:0 0 20px var(--color)}.copy small{color:var(--cyan);text-transform:uppercase;letter-spacing:.16em;font-size:9px}.copy h1{margin:2px 0 3px;font-size:22px;line-height:1}.copy p{margin:0;color:var(--muted);font-size:12px}.more{width:38px;height:38px;border:0;border-radius:50%;background:rgba(142,190,214,.12)}nav{position:absolute;inset:auto 0 0;height:calc(82px + env(safe-area-inset-bottom));display:grid;grid-template-columns:1fr 1fr 1.15fr 1fr 1fr;align-items:start;padding:12px 9px env(safe-area-inset-bottom);border-top:1px solid rgba(174,215,238,.1);background:rgba(4,10,18,.9);z-index:5}.nav{border:0;background:none;display:grid;justify-items:center;gap:4px;color:#6f8298;font-size:20px}.nav small{font-size:9px}.nav.active{color:var(--cyan)}.locate{justify-self:center;transform:translateY(-27px);width:62px;height:62px;border:7px solid #07101b;border-radius:50%;background:linear-gradient(145deg,#a7edff,#65bedb);color:#06101b;font-size:29px}.locate.tracking{animation:pulse 1.6s infinite}@keyframes pulse{50%{box-shadow:0 0 0 10px rgba(105,209,239,.1)}}.sheet{position:absolute;inset:24% 0 0;padding:10px 18px;border-radius:28px 28px 0 0;background:rgba(7,15,27,.98);z-index:10;animation:rise .25s ease-out}.hidden{display:none!important}@keyframes rise{from{transform:translateY(100%)}}.handle{width:40px;height:4px;margin:0 auto 18px;border-radius:3px;background:#314055}.search{display:grid;grid-template-columns:24px 1fr auto;align-items:center;gap:8px;padding:5px 6px 5px 13px;border:1px solid rgba(171,215,240,.12);border-radius:15px;background:#101d2c}.search input{min-width:0;padding:9px 0;border:0;outline:0;background:transparent;color:white}.search button{border:0;background:transparent;color:var(--cyan)}.results{margin-top:16px}.result{display:grid;grid-template-columns:10px 1fr auto;align-items:center;gap:14px;width:100%;padding:13px 8px;border:0;border-bottom:1px solid rgba(151,188,211,.09);text-align:left;background:transparent}.dot{width:8px;height:8px;border-radius:50%}.result strong,.result small{display:block}.result small{margin-top:3px;color:var(--muted);font-size:11px}.result b{color:#62768c;font-size:23px}.permission{position:absolute;inset:0;display:grid;place-items:end center;padding:24px;z-index:20;background:linear-gradient(transparent 10%,rgba(2,6,12,.96) 70%)}.permission-card{width:min(100%,420px);padding:23px;border:1px solid rgba(161,214,239,.17);border-radius:25px;background:#0b1625;box-shadow:0 30px 80px #000}.permission-card small{color:var(--cyan);text-transform:uppercase;letter-spacing:.15em}.permission-card h2{margin:8px 0;font-size:25px}.permission-card p{margin:0 0 18px;color:#9fb0c3;line-height:1.5;font-size:14px}.permission-card button{width:100%;padding:14px;border:0;border-radius:14px;background:var(--cyan);color:#04101a;font-weight:700}.permission-card .cancel{margin-top:8px;background:transparent;color:#8fa2b7}.error{margin:10px 0 0!important;color:#ff9b8b!important;font-size:12px!important}@media(min-width:720px){.app{width:min(100%,520px);margin:auto;box-shadow:0 0 100px #000}}@media(prefers-reduced-motion:reduce){*{animation-duration:.01ms!important;transition-duration:.01ms!important}}
  </style>
</head>
<body>
  <main class="app" id="app">
    <video class="camera" id="camera" autoplay muted playsinline></video><canvas id="stars"></canvas><div class="aurora"></div>
    <section class="sky" id="sky" aria-label="Interactive sky map"><div class="horizon"></div></section>
    <header class="topbar"><div class="brand"><span class="brand-mark">✦</span>Aster</div><div class="actions"><button class="round" id="night" aria-label="Toggle night mode">◐</button><button class="round" id="searchButton" aria-label="Search the sky">⌕</button></div></header>
    <div class="compass"><span id="bearingLeft">W</span><span>│</span><strong id="bearing">285°</strong><span>│</span><span id="bearingRight">NW</span></div><div class="ar-status"><span class="status-dot"></span><span id="statusText">Camera live · locating…</span></div><div class="crosshair"></div>
    <aside class="card"><div class="art" id="art"><span></span></div><div class="copy"><small id="type">Planet</small><h1 id="name">Saturn</h1><p id="meta">1.34 billion km away</p></div><button class="more" aria-label="More information">↗</button></aside>
    <nav aria-label="Main navigation"><button class="nav active"><span>✦</span><small>Sky</small></button><button class="nav"><span>◷</span><small>Tonight</small></button><button class="locate" id="locate" aria-label="Use phone orientation">⌖</button><button class="nav"><span>◎</span><small>Explore</small></button><button class="nav"><span>≡</span><small>More</small></button></nav>
    <div class="sheet hidden" id="sheet" role="dialog" aria-modal="true"><div class="handle"></div><div class="search"><span>⌕</span><input id="query" placeholder="Search planets, stars…"><button id="done">Done</button></div><div class="results" id="results"></div></div><div class="permission hidden" id="permission"><div class="permission-card"><small>Live sky mode</small><h2>Point Aster at the sky</h2><p>Aster needs your rear camera, location, and motion sensors to align the sky overlay. Nothing is recorded or uploaded.</p><button id="allow">Allow & start camera</button><button class="cancel" id="cancel">Not now</button><p class="error hidden" id="permissionError"></p></div></div>
  </main>
  <script>
    const $=s=>document.querySelector(s),app=$('#app'),night=$('#night'),searchButton=$('#searchButton'),sheet=$('#sheet'),query=$('#query'),done=$('#done'),results=$('#results'),nameEl=$('#name'),typeEl=$('#type'),metaEl=$('#meta'),art=$('#art'),locate=$('#locate'),camera=$('#camera'),permission=$('#permission'),allow=$('#allow'),cancel=$('#cancel'),permissionError=$('#permissionError'),bearing=$('#bearing'),bearingLeft=$('#bearingLeft'),bearingRight=$('#bearingRight'),statusText=$('#statusText');let stream=null,arActive=false,watchId=null;
    const objects=[{name:'Saturn',type:'Planet',meta:'1.34 billion km',x:68,y:32,color:'#f3c785',size:10},{name:'Vega',type:'Star',meta:'25 light-years',x:25,y:22,color:'#d8eaff',size:5},{name:'Altair',type:'Star',meta:'16.7 light-years',x:38,y:57,color:'#edf4ff',size:4},{name:'Deneb',type:'Star',meta:'2,600 light-years',x:16,y:46,color:'#b8d9ff',size:4},{name:'Arcturus',type:'Star',meta:'36.7 light-years',x:82,y:66,color:'#ffb06d',size:6},{name:'Mars',type:'Planet',meta:'225 million km',x:58,y:74,color:'#ff7d5c',size:7}];
    const lines=[[25,22,38,57],[25,22,16,46],[38,57,16,46],[68,32,82,66],[58,74,82,66]],sky=document.querySelector('#sky');
    lines.forEach(l=>{const e=document.createElement('i'),dx=l[2]-l[0],dy=l[3]-l[1];e.className='line';e.style.cssText=`left:${l[0]}%;top:${l[1]}%;width:${Math.hypot(dx,dy).toFixed(3)}%;transform:rotate(${(Math.atan2(dy,dx)*180/Math.PI).toFixed(3)}deg)`;sky.append(e)});
    function select(o){document.querySelectorAll('.celestial').forEach(e=>e.classList.toggle('active',e.dataset.name===o.name));nameEl.textContent=o.name;typeEl.textContent=o.type;metaEl.textContent=o.meta+' away';art.style.setProperty('--color',o.color)}
    objects.forEach(o=>{const b=document.createElement('button');b.className='celestial';b.dataset.name=o.name;b.setAttribute('aria-label','Select '+o.name);b.style.cssText=`left:${o.x}%;top:${o.y}%;--color:${o.color};--size:${o.size}px`;b.innerHTML=`<span class="orb"></span><span class="label">${o.name}</span>`;b.onclick=()=>select(o);sky.append(b)});select(objects[0]);
    const canvas=document.querySelector('#stars'),ctx=canvas.getContext('2d');let frame=0;function draw(){const d=Math.min(devicePixelRatio||1,2),w=canvas.clientWidth,h=canvas.clientHeight;if(canvas.width!==w*d||canvas.height!==h*d){canvas.width=w*d;canvas.height=h*d;ctx.setTransform(d,0,0,d,0,0)}ctx.clearRect(0,0,w,h);for(let i=0;i<170;i++){const x=((i*83+2417)%997)/997*w,y=((i*i*29+2417)%991)/991*h,p=.45+.4*Math.sin(frame/38+i);ctx.beginPath();ctx.arc(x,y,i%17?0.55:1.4,0,Math.PI*2);ctx.fillStyle=`rgba(225,239,255,${p})`;ctx.fill()}frame++;requestAnimationFrame(draw)}draw();
    night.onclick=()=>{app.classList.toggle('night');night.textContent=app.classList.contains('night')?'☼':'◐'};searchButton.onclick=()=>{sheet.classList.remove('hidden');query.focus()};done.onclick=()=>sheet.classList.add('hidden');
    function render(q=''){results.innerHTML='';objects.filter(o=>o.name.toLowerCase().includes(q.toLowerCase())).forEach(o=>{const b=document.createElement('button');b.className='result';b.innerHTML=`<span class="dot" style="background:${o.color}"></span><span><strong>${o.name}</strong><small>${o.type} · ${o.meta}</small></span><b>›</b>`;b.onclick=()=>{select(o);sheet.classList.add('hidden')};results.append(b)})}query.oninput=()=>render(query.value);render();
    const directions=['N','NE','E','SE','S','SW','W','NW'];function orientation(e){const h=Math.round(e.webkitCompassHeading??((360-(e.alpha||0))%360)),pitch=Math.max(-90,Math.min(90,e.beta||0));bearing.textContent=h+'°';bearingLeft.textContent=directions[Math.round((h-22.5+360)/45)%8];bearingRight.textContent=directions[Math.round((h+22.5)/45)%8];sky.style.transform=`translate3d(${Math.max(-22,Math.min(22,(e.gamma||0)/2))}px,${Math.max(-28,Math.min(28,(pitch-45)/2))}px,0)`}
    function showError(message){permissionError.textContent=message;permissionError.classList.remove('hidden');allow.textContent='Try again'}
    async function startAR(){permissionError.classList.add('hidden');allow.textContent='Starting…';allow.disabled=true;try{if(!navigator.mediaDevices?.getUserMedia)throw Error('Camera access is not supported in this browser.');stream=await navigator.mediaDevices.getUserMedia({video:{facingMode:{ideal:'environment'},width:{ideal:1920},height:{ideal:1080}},audio:false});camera.srcObject=stream;await camera.play();if('DeviceOrientationEvent'in window&&typeof DeviceOrientationEvent.requestPermission==='function'){const result=await DeviceOrientationEvent.requestPermission();if(result!=='granted')throw Error('Motion access was not allowed. Enable Motion & Orientation Access in Safari settings.')}if('DeviceOrientationEvent'in window)addEventListener('deviceorientation',orientation,true);if(navigator.geolocation){watchId=navigator.geolocation.watchPosition(p=>{statusText.textContent=`Camera live · GPS ±${Math.round(p.coords.accuracy)}m`},()=>{statusText.textContent='Camera live · location unavailable'},{enableHighAccuracy:true,maximumAge:10000,timeout:15000})}app.classList.add('ar');locate.classList.add('tracking');permission.classList.add('hidden');arActive=true}catch(error){stream?.getTracks().forEach(t=>t.stop());stream=null;showError(error.message||'Permission was denied. Check your browser settings and try again.')}finally{allow.disabled=false;if(!arActive)allow.textContent='Try again'}}
    function stopAR(){stream?.getTracks().forEach(t=>t.stop());stream=null;camera.srcObject=null;if(watchId!==null)navigator.geolocation.clearWatch(watchId);removeEventListener('deviceorientation',orientation,true);app.classList.remove('ar');locate.classList.remove('tracking');arActive=false}
    locate.onclick=()=>{if(arActive){stopAR()}else{permission.classList.remove('hidden')}};allow.onclick=startAR;cancel.onclick=()=>permission.classList.add('hidden');document.addEventListener('visibilitychange',()=>{if(document.hidden&&arActive)stopAR()});
  </script>
</body>
</html>
